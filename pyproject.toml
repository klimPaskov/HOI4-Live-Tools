[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hoi4-live-tools"
version = "1.1.0"
description = "Cross-platform stdio MCP tools for Hearts of Iron IV observation and player actions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Klim Pashkov" }]
keywords = ["hoi4", "hearts-of-iron-iv", "mcp", "modding", "testing", "agents"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "numpy>=1.21",
  "Pillow>=9.0",
  "opencv-python-headless>=4.5",
  "pyobjc-framework-Cocoa>=10,<12; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10,<12; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10,<12; sys_platform == 'darwin'",
  "pyobjc-framework-ScreenCaptureKit>=10,<12; sys_platform == 'darwin'",
  "pyobjc-framework-Vision>=10,<12; sys_platform == 'darwin'",
]

[project.scripts]
hoi4-live-tools = "hoi4_live.__main__:main"

[tool.setuptools.packages.find]
include = ["hoi4_live*"]

[tool.setuptools.package-data]
hoi4_live = ["ocr/ocr_host.ps1", "game/play_policy.json"]
