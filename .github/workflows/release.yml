name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tag matches the package version
        run: test "v$(python -c 'import install; print(install.read_version("."))')" = "$GITHUB_REF_NAME"
      - run: python scripts/build_release.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/hoi4-live-tools-*.zip

  native:
    strategy:
      fail-fast: true
      matrix:
        include:
          # 22.04 keeps the glibc floor at 2.35 for older WSL and desktop distributions.
          - os: ubuntu-22.04
            platform: linux-x86_64
          # The ScreenCaptureKit recorder needs the macOS 15 SDK.
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches the crate version
        shell: bash
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' native/Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - run: cargo test --manifest-path native/Cargo.toml --locked --release
      - run: cargo build --manifest-path native/Cargo.toml --locked --release --bin hoi4-live-native
      - if: runner.os == 'macOS'
        name: Ad-hoc sign with the debugger entitlement
        run: |
          codesign --force --sign - --entitlements native/macos/debugger.entitlements native/target/release/hoi4-live-native
          codesign --display --entitlements - native/target/release/hoi4-live-native
          codesign --verify --strict native/target/release/hoi4-live-native
          codesign --display --entitlements - native/target/release/hoi4-live-native 2>&1 | grep -q com.apple.security.cs.debugger
      - run: python3 scripts/package_native.py --binary native/target/release/hoi4-live-native --platform ${{ matrix.platform }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: dist/*.tar.gz

  publish:
    needs: [python, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The one-line installers fetch install.py from the release and check it against SHA256SUMS.txt.
      - name: Installer files
        run: cp install.py install.sh install.ps1 dist/
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum hoi4-live-tools-*.zip hoi4-live-native-*.tar.gz install.py install.sh install.ps1 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: The one-line installer installs this release from the built files
        run: |
          HOI4_LIVE_RELEASE_BASE="$PWD/dist" sh dist/install.sh --prefix "$RUNNER_TEMP/prefix" --home "$RUNNER_TEMP/home" \
            --register none --skip-selftest
          "$RUNNER_TEMP/prefix/hoi4-live" status
          "$RUNNER_TEMP/prefix/native/hoi4-live-native" --doctor || true
          "$RUNNER_TEMP/prefix/hoi4-live" uninstall --home "$RUNNER_TEMP/home"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/hoi4-live-tools-*.zip
            dist/hoi4-live-native-*.tar.gz
            dist/install.py
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS.txt
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} on && /^(## |### Native runtime)/ {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md
          {
            echo
            echo "Full list of changes: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."
            echo
            echo "Verify a download: \`sha256sum -c SHA256SUMS.txt --ignore-missing\` and"
            echo "\`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
          } >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md \
            dist/hoi4-live-tools-*.zip dist/hoi4-live-native-*.tar.gz dist/SHA256SUMS.txt \
            dist/install.py dist/install.sh dist/install.ps1
