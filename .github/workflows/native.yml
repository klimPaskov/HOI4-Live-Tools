name: Native Rust
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        name: Check ARM64 Linux compilation
        run: |
          rustup target add aarch64-unknown-linux-musl
          cargo clippy --manifest-path native/Cargo.toml --target aarch64-unknown-linux-musl --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path native/Cargo.toml --locked
      - if: runner.os == 'Linux'
        run: |
          if [ "$(cat /proc/sys/kernel/yama/ptrace_scope)" = "1" ]; then
            cargo test --manifest-path native/Cargo.toml --locked --lib \
              --config 'target.x86_64-unknown-linux-gnu.rustflags=["-C","link-arg=-Wl,--build-id=sha1"]' \
              platform::linux::tests::generated:: -- --ignored --nocapture --test-threads=1
          else
            echo 'Opt-in parent-reader evidence requires existing Yama scope 1; kernel policy unchanged.'
          fi
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          python3 native/tests/run_x11_fixture.py
