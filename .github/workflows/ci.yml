name: Cross-platform Python
on:
  push:
    branches: [master, 'feat/**', 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HOI4_LIVE_CONFIG: ${{ github.workspace }}/../hoi4-ci/absent-hoi4-config.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m compileall -q hoi4_live scripts
      - run: python -m unittest discover -s tests -v
      - run: python scripts/protocol_smoke.py
