name: Cross-platform Python
on:
  # A pull request runs on its own; a push only runs on master, so a branch with a pull request is not tested twice.
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
# A new push to a pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HOI4_LIVE_CONFIG: ${{ github.workspace }}/../hoi4-ci/absent-hoi4-config.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m compileall -q hoi4_live scripts
      - run: python -m unittest discover -s tests -v
      # Every key the plan schema accepts has a reader: the executor, the planning tools or people.
      - run: python scripts/hoi4facts/plan_keys.py check
      - run: python scripts/protocol_smoke.py
