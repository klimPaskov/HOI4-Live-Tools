[package]
name = "hoi4-live-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0 AND MIT"
description = "Owned-process native MCP foundation for HOI4 Live Tools"

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xtest"] }
x11rb-protocol = "0.13.2"
