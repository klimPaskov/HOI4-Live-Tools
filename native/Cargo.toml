[package]
name = "hoi4-live-native"
version = "1.4.2"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0 AND MIT"
description = "Owned-process native MCP foundation for HOI4 Live Tools"

[features]
# Development only: reload the Linux address table from HOI4_LIVE_DEV_TABLE (never in releases).
dev-table = []

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xtest", "xkb"] }
x11rb-protocol = "0.13.2"
